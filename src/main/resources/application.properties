# Shared application settings
spring.application.name=LendUp
spring.profiles.default=dev
server.port=${PORT:8080}

spring.sql.init.mode=always
springdoc.swagger-ui.path=/swagger-ui.html




# RabbitMQ (Sprint 2): Préstamos consume pagos.pago-confirmado.v1 y pagos.garantia-constituida.v1
# de lendup-payments-service. En dev está apagado salvo MESSAGING_ENABLED=true; en prod viene encendido.
lendup.messaging.enabled=${MESSAGING_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s

# Each incident can include up to six photos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=32MB
