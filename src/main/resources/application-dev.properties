# Development datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lendup?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# JWT
authorization.jwt.secret=tankiq-dev-super-secret-key-change-me-please-32bytes-min
authorization.jwt.expiration.days=7
