# Local MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lendup?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings for local development
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Firebase project used to verify ID tokens.
firebase.project-id=${FIREBASE_PROJECT_ID:demo-lendup}